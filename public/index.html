<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Point Property Services • Portal Móvil de Facturación</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Cinzel', 'serif'],
                    },
                    colors: {
                        forest: {
                            800: '#16382b',
                            900: '#0d231b',
                            950: '#07140f',
                        },
                        gold: {
                            100: '#fbf5e0',
                            200: '#f5e6b8',
                            400: '#e2c055',
                            500: '#d4af37',
                            600: '#b89225',
                            700: '#947218',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-forest-950 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Notificaciones flotantes (Toast) -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <div id="login-screen" class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border-2 border-gold-500/60">
        <!-- Cabecera de Login -->
        <div class="bg-forest-900 px-6 py-7 text-center border-b-2 border-gold-500 relative">
            <div class="inline-flex items-center justify-center bg-forest-950/80 border border-gold-500/50 p-3 rounded-2xl mb-3 shadow-inner">
                <svg class="w-16 h-10" viewBox="0 0 120 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 52 L42 20 L63 39" stroke="#d4af37" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M34 52 L72 14 L112 52" stroke="#d4af37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="65" y="33" width="6.5" height="6.5" fill="#d4af37"/>
                    <rect x="73.5" y="33" width="6.5" height="6.5" fill="#d4af37"/>
                    <rect x="65" y="41.5" width="6.5" height="6.5" fill="#d4af37"/>
                    <rect x="73.5" y="41.5" width="6.5" height="6.5" fill="#d4af37"/>
                </svg>
            </div>
            <h1 class="font-display text-xl sm:text-2xl font-bold text-gold-400 tracking-wider">ELITE POINT</h1>
            <p class="text-[11px] font-bold tracking-widest text-slate-200 uppercase">PROPERTY SERVICES</p>
            <p class="text-[11px] text-gold-200/80 italic mt-1">A DBA of Global Trading Solutions LLC</p>
        </div>

        <!-- Formulario de Inicio de Sesión -->
        <form id="login-form" onsubmit="handleLogin(event)" class="p-6 space-y-4">
            <div class="text-center mb-1">
                <h2 class="text-base font-extrabold text-forest-900">Acceso al Sistema de Facturación</h2>
                <p class="text-xs text-slate-500">Ingresa tus credenciales para emitir presupuestos y facturas</p>
            </div>

            <div id="login-error-box" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs font-semibold px-3 py-2.5 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="login-error-text">Usuario o contraseña incorrectos.</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Usuario o Correo Corporativo</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3 text-slate-400 text-sm"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="login-user" required placeholder="Ingresa tu usuario"
                        class="w-full text-sm font-medium text-slate-900 bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-3 py-2.5 focus:bg-white focus:border-gold-500 focus:outline-none">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-bold text-slate-700">Contraseña</label>
                </div>
                <div class="relative">
                    <span class="absolute left-3.5 top-3 text-slate-400 text-sm"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="login-pass" required placeholder="••••••••"
                        class="w-full text-sm font-medium text-slate-900 bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-10 py-2.5 focus:bg-white focus:border-gold-500 focus:outline-none">
                    <button type="button" onclick="togglePasswordVisibility('login-pass', 'login-eye-icon')" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-700 p-1">
                        <i id="login-eye-icon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-forest-900 hover:bg-forest-800 text-gold-400 font-extrabold text-sm rounded-xl shadow-md border border-gold-500/40 flex items-center justify-center gap-2 transition-all">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Iniciar Sesión</span>
            </button>
        </form>
    </div>
    <p class="text-[11px] text-slate-400 mt-4 text-center">US Billing & Estimate System • Indiana Sales Tax Ready</p>

    <script>
        function togglePasswordVisibility(passId, iconId) {
            const passInput = document.getElementById(passId);
            const icon = document.getElementById(iconId);
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.className = 'fa-solid fa-eye-slash text-sm';
            } else {
                passInput.type = 'password';
                icon.className = 'fa-solid fa-eye text-sm';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            if ((user === 'javier' || user === 'admin@elitepoint.com') && pass === 'Elite2026') {
                localStorage.setItem('elite_logged', 'true');
                window.location.href = 'app.html';
            } else {
                const box = document.getElementById('login-error-box');
                box.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
