<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Point Property Services • Sistema de Facturación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Cinzel', 'serif'] },
                    colors: {
                        forest: { 800: '#16382b', 900: '#0d231b', 950: '#07140f' },
                        gold: { 100: '#fbf5e0', 200: '#f5e6b8', 400: '#e2c055', 500: '#d4af37', 600: '#b89225', 700: '#947218' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen pb-24">

    <div id="app-shell">
        <!-- CABECERA PRINCIPAL CON LOS BOTONES SUPERIORES -->
        <header class="bg-forest-900 text-white border-b-2 border-gold-500 sticky top-0 z-30 shadow-md w-full">
            <div class="w-full px-4 sm:px-8 h-16 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="shrink-0 pt-1">
                        <svg class="w-10 h-8" viewBox="0 0 120 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 52 L42 22 L62 40" stroke="#d4af37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M34 52 L72 14 L112 52" stroke="#d4af37" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="65" y="33" width="6.5" height="6.5" fill="#d4af37"/>
                            <rect x="73.5" y="33" width="6.5" height="6.5" fill="#d4af37"/>
                            <rect x="65" y="41.5" width="6.5" height="6.5" fill="#d4af37"/>
                            <rect x="73.5" y="41.5" width="6.5" height="6.5" fill="#d4af37"/>
                        </svg>
                    </div>
                    <div class="truncate">
                        <h1 class="font-display font-bold text-gold-400 text-lg sm:text-xl tracking-wide truncate">ELITE POINT</h1>
                        <p class="text-[10px] text-slate-300 truncate">Global Trading Solutions LLC</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <!-- BOTÓN DINÁMICO IMPRIMIR / VER -->
                    <button onclick="goToPrintPage()" id="btn-dynamic-action" class="px-3 py-2 text-xs font-extrabold text-forest-950 bg-gold-500 hover:bg-gold-400 rounded-xl transition-all flex items-center gap-1.5 shadow">
                        <i class="fa-solid fa-print"></i> <span id="btn-action-text">Imprimir / Ver Presupuesto</span>
                    </button>
                    <!-- BOTÓN ENVIAR LINK DE PAGO -->
                    <button onclick="openPaymentLinkModal()" class="px-3 py-2 text-xs font-extrabold text-white bg-emerald-600 hover:bg-emerald-500 rounded-xl transition-all flex items-center gap-1.5 shadow">
                        <i class="fa-solid fa-credit-card"></i> <span>Enviar Link de Pago</span>
                    </button>
                    <button onclick="createNewDocument()" class="px-2.5 py-2 text-xs font-bold text-white bg-forest-800 hover:bg-forest-700 rounded-xl transition-all">
                        <i class="fa-solid fa-plus"></i> <span>Nuevo</span>
                    </button>
                    <button onclick="logoutUser()" class="p-2 text-red-300 hover:text-white bg-forest-800 hover:bg-red-900/60 rounded-xl transition-all" title="Cerrar Sesión">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- VISTA DE EDITOR EN CAMPO -->
        <main class="max-w-4xl mx-auto px-4 pt-6 space-y-4">
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button type="button" onclick="setDocType('estimate')" id="btn-type-estimate" class="flex flex-col items-center p-3.5 rounded-xl border-2 border-forest-900 bg-forest-900 text-white shadow-xs">
                        <span class="text-xs sm:text-sm font-extrabold">Presupuesto (ESTIMATE)</span>
                    </button>
                    <button type="button" onclick="setDocType('invoice')" id="btn-type-invoice" class="flex flex-col items-center p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-700">
                        <span class="text-xs sm:text-sm font-extrabold">Factura (INVOICE)</span>
                    </button>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-3 border-t border-slate-100">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1">Número (#):</label>
                        <input type="text" id="doc-number" value="EST-2026-001" class="w-full text-xs font-bold bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1">Fecha Emisión:</label>
                        <input type="date" id="doc-date" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2.5">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1">Válido Hasta:</label>
                        <input type="date" id="doc-due-date" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2.5">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1">Términos:</label>
                        <select id="doc-terms" class="w-full text-xs font-bold bg-gold-100 border border-gold-400 rounded-xl px-2.5 py-2.5">
                            <option value="Due on Receipt">Due on Receipt (Al recibir)</option>
                            <option value="Net 30">Net 30 (30 días)</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-3">
                <h2 class="text-sm font-extrabold text-forest-900">Datos del Cliente y Propiedad</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="client-name" placeholder="Nombre del Cliente *" class="w-full text-sm bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5">
                    <input type="email" id="client-email" placeholder="Correo Electrónico" class="w-full text-sm bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5">
                    
                    <div class="flex items-center bg-slate-50 border border-slate-300 rounded-xl overflow-hidden focus-within:border-gold-500">
                        <span class="bg-slate-200 px-3 py-2.5 text-xs font-bold text-slate-700 border-r border-slate-300">+1</span>
                        <input type="tel" id="client-phone" placeholder="4632878167" class="w-full text-sm bg-transparent px-3 py-2.5 focus:outline-none">
                    </div>
                </div>
                <input type="text" id="client-address" placeholder="Dirección de la Propiedad" class="w-full text-sm bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5">
                
                <!-- CAMPO PARA EL LINK DE PAGO -->
                <div class="pt-2 border-t border-slate-100">
                    <label class="block text-[11px] font-bold text-emerald-800 mb-1"><i class="fa-solid fa-credit-card"></i> Link de Pago (Stripe / Square / URL):</label>
                    <input type="url" id="payment-link" placeholder="https://buy.stripe.com/..." class="w-full text-xs bg-emerald-50/50 border border-emerald-300 rounded-xl px-3 py-2.5 text-slate-700 font-medium">
                </div>
            </section>

            <!-- SECCIÓN FOTO DE LA CASA Y DESCRIPCIÓN (SOLO PRESUPUESTO) -->
            <section id="house-photo-editor-section" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-extrabold text-forest-900 flex items-center gap-2">
                        <i class="fa-solid fa-house-chimney text-gold-600"></i> Foto de la Casa / Propiedad y Descripción (Solo Presupuesto)
                    </h2>
                    <button type="button" id="btn-remove-photo" onclick="removeHousePhoto()" class="hidden text-xs font-bold text-red-600 hover:underline">
                        <i class="fa-solid fa-trash"></i> Quitar foto
                    </button>
                </div>
                <input type="file" id="house-photo-input" accept="image/*" onchange="handleHousePhotoUpload(event)" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-forest-900 file:text-gold-400 hover:file:bg-forest-800 cursor-pointer">
                
                <div id="house-photo-editor-preview-box" class="hidden space-y-3 pt-2">
                    <img id="house-photo-editor-img" class="max-h-52 rounded-xl border border-slate-200 object-contain mx-auto bg-slate-50 p-2" alt="Vista previa casa">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Descripción detallada del área / propuesta:</label>
                        <textarea id="house-photo-caption" rows="3" placeholder="Ej: Propuesta de instalación perimetral..." class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-3 focus:outline-none focus:border-gold-500"></textarea>
                    </div>
                </div>
            </section>

            <!-- SERVICIOS Y MATERIALES -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
                <h2 class="text-sm font-extrabold text-forest-900">Servicios, Materiales y Mano de Obra</h2>
                <div id="items-cards-container" class="space-y-4"></div>

                <button type="button" onclick="addItemCard()" class="w-full py-3 px-4 bg-forest-900/5 hover:bg-forest-900/10 border-2 border-dashed border-forest-900/30 text-forest-900 rounded-xl text-xs sm:text-sm font-bold transition-all">
                    <i class="fa-solid fa-plus-circle text-gold-600"></i> Agregar otro Tipo de Servicio
                </button>
            </section>
        </main>
    </div>

    <!-- MODAL RÁPIDO PARA ENVIAR SOLO EL LINK DE PAGO -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-base text-forest-900">Enviar Enlace del Documento por SMS</h3>
                <button onclick="closePaymentModal()" class="text-slate-400 hover:text-slate-600 text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-600">Mensaje con el enlace limpio:</label>
                <textarea id="payment-text-box" rows="4" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-3 font-medium text-slate-700 focus:outline-none"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="copyPaymentText()" class="py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-copy"></i> Copiar Texto
                </button>
                <button onclick="sendPaymentSMS()" class="py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-paper-plane"></i> Enviar SMS
                </button>
            </div>
        </div>
    </div>

    <script>
        // URL de tu Worker de Cloudflare configurado con INVOICES
        const API_URL = "https://elite-api.mtua3458.workers.dev";

        const serviceOptions = [
            "Christmas Lights Installation & Removal",
            "Roofline Lighting Service",
            "Trees & Landscaping Lighting",
            "Wreaths & Holiday Decor",
            "General Landscaping & Maintenance",
            "Home Improvement Services",
            "✨ Servicio Personalizado (Custom Service)"
        ];

        const materialOptions = [
            "Commercial Grade Warm White LED Bulbs",
            "Commercial Grade Multi-Color LED Bulbs",
            "Heavy Duty Intermediate C7/C9 Spool Wire",
            "All-Purpose Mounting Clips & Fasteners",
            "Digital Programmable Outdoor Timer",
            "Waterproof Connection Box & Safety Enclosures",
            "Holiday Wreaths & Garlands Decor",
            "✨ Material Personalizado (Custom Material)"
        ];

        let docType = 'estimate';
        let housePhotoDataUrl = null;
        let items = [
            { 
                serviceIndex: 0, 
                customService: '', 
                laborRate: 150,
                materials: [
                    { materialIndex: 0, customMaterial: '', qty: '1', rate: 50 }
                ]
            }
        ];

        if (localStorage.getItem('elite_logged') !== 'true') { window.location.href = 'index.html'; }
        function logoutUser() { localStorage.removeItem('elite_logged'); window.location.href = 'index.html'; }
        
        function createNewDocument() {
            items = [{ serviceIndex: 0, customService: '', laborRate: 150, materials: [{ materialIndex: 0, customMaterial: '', qty: '1', rate: 50 }] }];
            removeHousePhoto();
            document.getElementById('payment-link').value = '';
            renderItemsEditor();
        }

        function setDocType(type) {
            docType = type;
            document.getElementById('btn-type-estimate').className = type === 'estimate' ? "flex flex-col items-center p-3.5 rounded-xl border-2 border-forest-900 bg-forest-900 text-white shadow-xs" : "flex flex-col items-center p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-700";
            document.getElementById('btn-type-invoice').className = type === 'invoice' ? "flex flex-col items-center p-3.5 rounded-xl border-2 border-forest-900 bg-forest-900 text-white shadow-xs" : "flex flex-col items-center p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-700";
            document.getElementById('house-photo-editor-section').classList.toggle('hidden', type !== 'estimate');

            const actionText = type === 'estimate' ? "Imprimir / Ver Presupuesto" : "Imprimir / Ver Factura";
            document.getElementById('btn-action-text').innerText = actionText;
        }

        function handleHousePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                housePhotoDataUrl = e.target.result;
                document.getElementById('house-photo-editor-img').src = housePhotoDataUrl;
                document.getElementById('house-photo-editor-preview-box').classList.remove('hidden');
                document.getElementById('btn-remove-photo').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function removeHousePhoto() {
            housePhotoDataUrl = null;
            document.getElementById('house-photo-input').value = '';
            document.getElementById('house-photo-caption').value = '';
            document.getElementById('house-photo-editor-preview-box').classList.add('hidden');
            document.getElementById('btn-remove-photo').classList.add('hidden');
        }

        function renderItemsEditor() {
            const container = document.getElementById('items-cards-container');
            container.innerHTML = '';
            
            items.forEach((item, sIndex) => {
                let servOptions = '';
                serviceOptions.forEach((s, idx) => { servOptions += `<option value="${idx}" ${item.serviceIndex === idx ? 'selected' : ''}>${s}</option>`; });
                const isCustomServ = item.serviceIndex === serviceOptions.length - 1;

                let materialsHTML = '';
                item.materials.forEach((mat, mIndex) => {
                    let matOptions = '';
                    materialOptions.forEach((m, idx) => { matOptions += `<option value="${idx}" ${mat.materialIndex === idx ? 'selected' : ''}>${m}</option>`; });
                    const isCustomMat = mat.materialIndex === materialOptions.length - 1;

                    materialsHTML += `
                        <div class="p-3 bg-white border border-slate-200 rounded-xl space-y-2.5 relative shadow-2xs">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] font-extrabold text-slate-400 uppercase">Material #${mIndex + 1}</span>
                                <button type="button" onclick="removeMaterial(${sIndex}, ${mIndex})" class="text-red-400 hover:text-red-600 text-xs px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <div>
                                <select onchange="updateMatSelect(${sIndex}, ${mIndex}, 'materialIndex', this.value)" class="w-full text-xs font-semibold bg-slate-50 border border-slate-300 rounded-xl p-2.5">
                                    ${matOptions}
                                </select>
                            </div>
                            <div class="${isCustomMat ? 'block' : 'hidden'}">
                                <label class="block text-[10px] font-bold text-slate-500 mb-1">Descripción / Material Personalizado:</label>
                                <textarea rows="3" placeholder="Ej: luces LED..." oninput="updateMatText(${sIndex}, ${mIndex}, 'customMaterial', this.value)" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2.5">${mat.customMaterial}</textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-3 pt-1">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Cantidad:</label>
                                    <input type="text" value="${mat.qty}" placeholder="Ej: 5" oninput="updateMatText(${sIndex}, ${mIndex}, 'qty', this.value)" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2 text-center font-bold">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Precio Unit. o Total ($):</label>
                                    <input type="number" value="${mat.rate}" min="0" step="0.01" placeholder="0.00" oninput="updateMatText(${sIndex}, ${mIndex}, 'rate', this.value)" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2 text-center font-bold">
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl space-y-3.5">
                        <div class="flex justify-between items-center border-b border-slate-200 pb-2.5">
                            <span class="text-xs font-extrabold text-forest-900 uppercase">Renglón de Servicio #${sIndex + 1}</span>
                            <button type="button" onclick="removeServiceItem(${sIndex})" class="text-red-500 hover:text-red-700 text-xs font-bold px-2.5 py-1 rounded-lg hover:bg-red-50"><i class="fa-solid fa-trash"></i> Eliminar</button>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Tipo de Servicio Principal:</label>
                            <select onchange="updateServiceSelect(${sIndex}, 'serviceIndex', this.value)" class="w-full text-xs font-semibold bg-white border border-slate-300 rounded-xl p-2.5">
                                ${servOptions}
                            </select>
                        </div>
                        <div class="${isCustomServ ? 'block' : 'hidden'}">
                            <input type="text" value="${item.customService}" placeholder="Nombre del servicio..." oninput="updateServiceText(${sIndex}, 'customService', this.value)" class="w-full text-xs bg-white border border-slate-300 rounded-xl p-2.5">
                        </div>

                        <div class="space-y-2.5 pt-1">
                            <label class="block text-[11px] font-bold text-slate-700">Materiales Asociados:</label>
                            <div class="space-y-2 pl-2 sm:pl-4 border-l-2 border-gold-500/50">
                                ${materialsHTML}
                            </div>
                            <button type="button" onclick="addMaterialToService(${sIndex})" class="w-full py-2.5 bg-forest-900/10 hover:bg-forest-900/20 text-forest-900 font-bold text-xs rounded-xl border border-forest-900/20 transition-all">
                                <i class="fa-solid fa-plus"></i> + Agregar otro material
                            </button>
                        </div>

                        <div class="pt-2 border-t border-slate-200">
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Mano de Obra (Labor Workmanship) [$]:</label>
                            <input type="number" value="${item.laborRate}" min="0" step="0.01" oninput="updateServiceText(${sIndex}, 'laborRate', this.value)" class="w-full text-xs bg-white border border-slate-300 rounded-xl p-2.5 font-bold">
                        </div>
                    </div>
                `;
            });
        }

        function addItemCard() { items.push({ serviceIndex: 0, customService: '', laborRate: 150, materials: [{ materialIndex: 0, customMaterial: '', qty: '1', rate: 50 }] }); renderItemsEditor(); }
        function removeServiceItem(index) { items.splice(index, 1); if (items.length === 0) addItemCard(); renderItemsEditor(); }
        function addMaterialToService(sIndex) { items[sIndex].materials.push({ materialIndex: 0, customMaterial: '', qty: '1', rate: 0 }); renderItemsEditor(); }
        function removeMaterial(sIndex, mIndex) { items[sIndex].materials.splice(mIndex, 1); if (items[sIndex].materials.length === 0) { items[sIndex].materials.push({ materialIndex: 0, customMaterial: '', qty: '1', rate: 0 }); } renderItemsEditor(); }
        function updateServiceSelect(index, field, val) { items[index][field] = parseInt(val) || 0; renderItemsEditor(); }
        function updateMatSelect(sIndex, mIndex, field, val) { items[sIndex].materials[mIndex][field] = parseInt(val) || 0; renderItemsEditor(); }
        function updateServiceText(index, field, val) { items[index][field] = field === 'laborRate' ? (parseFloat(val) || 0) : val; }
        function updateMatText(sIndex, mIndex, field, val) { items[sIndex].materials[mIndex][field] = field === 'rate' ? (parseFloat(val) || 0) : val; }

        function getPayloadData() {
            const docNum = document.getElementById('doc-number').value.trim() || 'EST-2026-001';
            return {
                type: docType,
                number: docNum,
                date: document.getElementById('doc-date').value,
                dueDate: document.getElementById('doc-due-date').value,
                terms: document.getElementById('doc-terms').value,
                clientName: document.getElementById('client-name').value.trim() || 'Valued Client',
                clientEmail: document.getElementById('client-email').value,
                clientPhone: document.getElementById('client-phone').value.trim(),
                clientAddress: document.getElementById('client-address').value,
                paymentLink: document.getElementById('payment-link').value.trim(),
                housePhoto: housePhotoDataUrl,
                houseCaption: document.getElementById('house-photo-caption').value,
                items: items,
                serviceOptions: serviceOptions,
                materialOptions: materialOptions
            };
        }

        // FUNCIÓN CLAVE: Sincroniza y guarda automáticamente en Cloudflare KV
        async function saveToCloudflareKV(docData) {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(docData)
                });
            } catch (err) {
                console.error("Error sincronizando con la nube:", err);
            }
        }

        // REDIRIGIR A FACTURA.HTML CON DATOS GUARDADOS EN LA NUBE Y LOCALSTORAGE (CORREGIDO A RUTA RELATIVA)
        async function goToPrintPage() {
            const docNum = document.getElementById('doc-number').value.trim();
            if (!docNum) { alert("Por favor ingresa el número de documento."); return; }
            const docData = getPayloadData();
            
            // Guardar localmente
            localStorage.setItem(`elite_doc_${docNum}`, JSON.stringify(docData));
            
            // Guardar en Cloudflare KV para que abra perfecto en otros dispositivos
            await saveToCloudflareKV(docData);
            
            // Abrir visor localmente en el mismo dominio
            window.location.href = `factura.html?doc=${docNum}`;
        }

        async function openPaymentLinkModal() {
            const docNum = document.getElementById('doc-number').value.trim();
            if (!docNum) { alert("Por favor ingresa el número de documento."); return; }
            
            const docData = getPayloadData();
            localStorage.setItem(`elite_doc_${docNum}`, JSON.stringify(docData));
            
            // Respaldar en la nube antes de generar el SMS
            await saveToCloudflareKV(docData);

            const clientName = document.getElementById('client-name').value.trim() || 'Valued Client';
            const clientFirstName = clientName.split(' ')[0];
            const docTypeStr = docType.toUpperCase();

            const cleanLink = `https://app.elitepointpropertyservices.com/factura.html?doc=${docNum}`;

            document.getElementById('payment-text-box').value = `Hi ${clientFirstName}, here is your ${docTypeStr} #${docNum}. Thank you for choosing Elite Point Property Services! View invoice here: ${cleanLink}`;
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        function copyPaymentText() {
            const textBox = document.getElementById('payment-text-box');
            textBox.select();
            textBox.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(textBox.value);
            alert("¡Texto copiado con éxito!");
        }

        function sendPaymentSMS() {
            const phoneVal = document.getElementById('client-phone').value.trim();
            if (!phoneVal) { alert("Falta el número de teléfono del cliente."); return; }
            const phone = `+1${phoneVal.replace(/\D/g,'')}`;
            const msg = encodeURIComponent(document.getElementById('payment-text-box').value);
            window.location.href = `sms:${phone}?body=${msg}`;
        }

        document.getElementById('doc-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('doc-due-date').value = new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0];
        renderItemsEditor();
    </script>
</body>
</html>
