<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Point • Panel de Control y Reportes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Cinzel', 'serif'] },
                    colors: {
                        forest: { 800: '#16382b', 900: '#0d231b', 950: '#07140f' },
                        gold: { 100: '#fbf5e0', 200: '#f5e6b8', 400: '#e2c055', 500: '#d4af37', 600: '#b89225', 700: '#947218' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen pb-24">

    <!-- CABECERA -->
    <header class="bg-forest-900 text-white border-b-2 border-gold-500 sticky top-0 z-30 shadow-md">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <h1 class="font-display font-bold text-gold-400 text-lg tracking-wide">ELITE POINT • DASHBOARD</h1>
            </div>
            <div class="flex items-center gap-2">
                <a href="app.html" class="px-3 py-2 text-xs font-extrabold text-forest-950 bg-gold-500 hover:bg-gold-400 rounded-xl transition-all flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-file-invoice"></i> Crear Documento
                </a>
                <button onclick="logoutUser()" class="p-2 text-red-300 hover:text-white bg-forest-800 rounded-xl transition-all" title="Cerrar Sesión">
                    <i class="fa-solid fa-right-from-bracket text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">
        
        <!-- TARJETAS DE RESUMEN Y FILTROS -->
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">Hoy</p>
                <h3 id="stat-day" class="text-2xl font-extrabold text-forest-900 mt-1">$0.00</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">Esta Semana</p>
                <h3 id="stat-week" class="text-2xl font-extrabold text-forest-900 mt-1">$0.00</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">Este Mes</p>
                <h3 id="stat-month" class="text-2xl font-extrabold text-forest-900 mt-1">$0.00</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">Este Año</p>
                <h3 id="stat-year" class="text-2xl font-extrabold text-forest-900 mt-1">$0.00</h3>
            </div>
        </div>

        <!-- GESTIÓN DE USUARIOS Y CREDENCIALES -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 class="text-sm font-extrabold text-forest-900 flex items-center gap-2">
                    <i class="fa-solid fa-users-gear text-gold-600"></i> Gestión de Usuarios y Accesos
                </h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input type="text" id="new-user-name" placeholder="Nuevo Usuario / Correo" class="text-xs bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5">
                <input type="password" id="new-user-pass" placeholder="Contraseña" class="text-xs bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5">
                <button onclick="addNewUser()" class="py-2.5 bg-forest-900 hover:bg-forest-800 text-gold-400 font-extrabold rounded-xl text-xs transition-all shadow">
                    <i class="fa-solid fa-user-plus"></i> Registrar Usuario
                </button>
            </div>
            <div id="users-list" class="text-xs text-slate-600 pt-2">
                <p class="font-bold text-slate-500 mb-1">Usuarios autorizados:</p>
                <ul id="users-ul" class="space-y-1"></ul>
            </div>
        </section>

        <!-- HISTORIAL Y LISTADO DE FACTURAS Y PRESUPUESTOS -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-3">
                <h2 class="text-sm font-extrabold text-forest-900 flex items-center gap-2">
                    <i class="fa-solid fa-folder-open text-gold-600"></i> Historial de Documentos Generados
                </h2>
                <div class="flex items-center gap-2">
                    <select id="filter-period" onchange="filterDocuments()" class="text-xs font-bold bg-slate-50 border border-slate-300 rounded-xl px-3 py-2">
                        <option value="all">Todos</option>
                        <option value="day">Hoy</option>
                        <option value="week">Esta Semana</option>
                        <option value="month">Este Mes</option>
                        <option value="year">Este Año</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b-2 border-slate-200 text-[11px] font-bold text-slate-400 uppercase">
                            <th class="py-3">Tipo / Número</th>
                            <th class="py-3">Fecha</th>
                            <th class="py-3">Cliente</th>
                            <th class="py-3 text-right">Total ($)</th>
                            <th class="py-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="documents-table-body" class="divide-y divide-slate-100 text-xs">
                        <tr>
                            <td colspan="5" class="py-6 text-center text-slate-400">Cargando documentos desde la nube...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        const API_URL = "https://elite-api.mtua3458.workers.dev";
        if (localStorage.getItem('elite_logged') !== 'true') { window.location.href = 'index.html'; }
        function logoutUser() { localStorage.removeItem('elite_logged'); window.location.href = 'index.html'; }

        let allDocuments = [];

        async function loadDashboardData() {
            try {
                // Simulamos la carga o petición al Worker
                // Aquí puedes adaptar si tu API devuelve todos los documentos en formato lista
                // Por ahora leemos del localStorage o Cloudflare KV
                allDocuments = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('elite_doc_')) {
                        try {
                            const doc = JSON.parse(localStorage.getItem(key));
                            allDocuments.push(doc);
                        } catch(e){}
                    }
                }
                
                renderStatsAndTable(allDocuments);
                renderUsersList();
            } catch (err) {
                console.error("Error cargando dashboard:", err);
            }
        }

        function calculateDocTotal(doc) {
            let matSub = 0, laborSub = 0;
            if (doc.items) {
                doc.items.forEach(item => {
                    laborSub += (item.laborRate || 0);
                    if (item.materials) {
                        item.materials.forEach(mat => {
                            let q = parseFloat(mat.qty) || 1;
                            matSub += q * (mat.rate || 0);
                        });
                    }
                });
            }
            let tax = matSub * 0.07;
            return matSub + tax + laborSub;
        }

        function renderStatsAndTable(docs) {
            let totalDay = 0, totalWeek = 0, totalMonth = 0, totalYear = 0;
            const now = new Date();

            const tbody = document.getElementById('documents-table-body');
            tbody.innerHTML = '';

            if (docs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">No hay documentos registrados aún.</td></tr>`;
                return;
            }

            docs.forEach(doc => {
                const total = calculateDocTotal(doc);
                const docDate = new Date(doc.date || Date.now());

                // Acumuladores de tiempo
                if (docDate.toDateString() === now.toDateString()) totalDay += total;
                if (isSameWeek(docDate, now)) totalWeek += total;
                if (docDate.getMonth() === now.getMonth() && docDate.getFullYear() === now.getFullYear()) totalMonth += total;
                if (docDate.getFullYear() === now.getFullYear()) totalYear += total;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 font-bold text-forest-900 uppercase">${doc.type} <br><span class="text-slate-400 font-normal">#${doc.number}</span></td>
                        <td class="py-3 text-slate-600">${doc.date}</td>
                        <td class="py-3 font-medium text-slate-800">${doc.clientName}</td>
                        <td class="py-3 text-right font-extrabold text-forest-900">$${total.toFixed(2)}</td>
                        <td class="py-3 text-center">
                            <a href="factura.html?doc=${doc.number}" target="_blank" class="px-2.5 py-1.5 bg-forest-900 text-gold-400 rounded-lg text-[11px] font-bold hover:bg-forest-800">Ver / Imprimir</a>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stat-day').innerText = `$${totalDay.toFixed(2)}`;
            document.getElementById('stat-week').innerText = `$${totalWeek.toFixed(2)}`;
            document.getElementById('stat-month').innerText = `$${totalMonth.toFixed(2)}`;
            document.getElementById('stat-year').innerText = `$${totalYear.toFixed(2)}`;
        }

        function isSameWeek(d1, d2) {
            const onejan = new Date(d1.getFullYear(), 0, 1);
            const week1 = Math.ceil((((d1 - onejan) / 86400000) + onejan.getDay() + 1) / 7);
            const week2 = Math.ceil((((d2 - onejan) / 86400000) + onejan.getDay() + 1) / 7);
            return week1 === week2 && d1.getFullYear() === d2.getFullYear();
        }

        function filterDocuments() {
            const period = document.getElementById('filter-period').value;
            const now = new Date();
            let filtered = allDocuments.filter(doc => {
                const d = new Date(doc.date || Date.now());
                if (period === 'day') return d.toDateString() === now.toDateString();
                if (period === 'week') return isSameWeek(d, now);
                if (period === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                if (period === 'year') return d.getFullYear() === now.getFullYear();
                return true;
            });
            renderStatsAndTable(filtered);
        }

        // Gestión local de usuarios adicionales
        function addNewUser() {
            const u = document.getElementById('new-user-name').value.trim();
            const p = document.getElementById('new-user-pass').value.trim();
            if (!u || !p) { alert("Ingresa usuario y contraseña."); return; }

            let users = JSON.parse(localStorage.getItem('elite_users') || '[{"user":"javier","pass":"Elite2026"}]');
            users.push({ user: u, pass: p });
            localStorage.setItem('elite_users', JSON.stringify(users));
            
            document.getElementById('new-user-name').value = '';
            document.getElementById('new-user-pass').value = '';
            renderUsersList();
            alert("¡Usuario registrado con éxito!");
        }

        function renderUsersList() {
            const ul = document.getElementById('users-ul');
            ul.innerHTML = '';
            let users = JSON.parse(localStorage.getItem('elite_users') || '[{"user":"javier","pass":"Elite2026"}]');
            users.forEach((usr, idx) => {
                ul.innerHTML += `<li class="flex justify-between items-center bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                    <span><i class="fa-solid fa-user-shield text-forest-900"></i> <strong>${usr.user}</strong></span>
                    ${idx > 0 ? `<button onclick="deleteUser(${idx})" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-trash"></i></button>` : '<span class="text-[10px] text-slate-400">Principal</span>'}
                </li>`;
            });
        }

        function deleteUser(idx) {
            let users = JSON.parse(localStorage.getItem('elite_users') || '[]');
            users.splice(idx, 1);
            localStorage.setItem('elite_users', JSON.stringify(users));
            renderUsersList();
        }

        loadDashboardData();
    </script>
</body>
</html>
